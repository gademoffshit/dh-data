name: draft data

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draft-data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: previous data
        run: |
          git clone --depth 1 --branch draft-data "https://github.com/${GITHUB_REPOSITORY}.git" data || mkdir -p data
          rm -rf data/.git

      - name: build
        run: python build.py data

      - name: publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd data
          git init -q -b draft-data
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -q -m "draft data $(date -u +%F)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" draft-data

      - name: refresh cdn
        continue-on-error: true
        run: |
          for f in data/stats/*.txt data/manifest.json; do
            p="${f#data/}"
            curl -s -m 20 -o /dev/null "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@draft-data/${p}" || true
          done
